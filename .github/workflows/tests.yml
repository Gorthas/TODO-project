name: Go

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TODO_PORT: "7540"

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Display Go version
        run: go version

      - name: Verify module dependencies
        run: go mod tidy -diff

      - name: Start local server
        id: server
        run: go run .
        background: true

      - name: Wait for local server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null "http://localhost:${TODO_PORT}/"; then
              exit 0
            fi

            sleep 1
          done

          echo "Server did not become ready in time"
          exit 1

      - name: Run TestApp
        run: go test -run '^TestApp$' ./tests

      - name: Run TestDB
        run: go test -run '^TestDB$' ./tests

      - name: Run TestNextDate
        run: go test -run '^TestNextDate$' ./tests

      - name: Run TestAddTask
        run: go test -run '^TestAddTask$' ./tests

      - name: Stop local server
        cancel: server
